<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeevan Rakshak AI</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background-size:cover;
  transition:1s;
}

.container {
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
  color:white;
  text-align:center;
}

textarea {
  width:100%;
  height:100px;
  border-radius:10px;
  padding:10px;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  color:white;
}

.analyze {background:red;}
.speak {background:green;}
.map {background:blue;}

#resultBox {
  margin-top:15px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">
<h2>🚑 Jeevan Rakshak AI</h2>

<select id="lang">
<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="gu">ગુજરાતી</option>
</select>

<p id="label">Enter your symptoms:</p>
<textarea id="symptoms"></textarea>

<button class="analyze" onclick="analyze()">Analyze</button>
<button class="speak" onclick="speak()">Speak</button>
<button class="map" onclick="map()">Nearby Hospital</button>

<div id="resultBox"></div>
</div>

<script>

/* BACKGROUND */
let imgs=[
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470"
];
let i=0;
setInterval(()=>{
document.body.style.backgroundImage="url("+imgs[i]+")";
i=(i+1)%imgs.length;
},5000);


/* FULL TRANSLATION */
function translateFull(text, lang){

if(lang==="hi"){
return text
.replace(/Life-threatening emergency/g,"जीवन के लिए खतरनाक स्थिति")
.replace(/Possible infection or illness/g,"संक्रमण या बीमारी की संभावना")
.replace(/Minor health issue/g,"छोटी स्वास्थ्य समस्या")

.replace(/Advice:/g,"सलाह:")
.replace(/Medicines:/g,"दवाएं:")
.replace(/Precautions:/g,"सावधानियां:")

.replace(/Go to hospital immediately/g,"तुरंत अस्पताल जाएं")
.replace(/Take rest and stay hydrated/g,"आराम करें और पानी पिएं")
.replace(/Rest properly/g,"अच्छे से आराम करें")

.replace(/Paracetamol/g,"पैरासिटामोल")
.replace(/ORS/g,"ओआरएस")

.replace(/Monitor symptoms/g,"लक्षणों पर ध्यान रखें")
.replace(/Call ambulance immediately/g,"तुरंत एम्बुलेंस बुलाएं")

.replace(/Do not take any medicine without consulting a doctor/g,"डॉक्टर की सलाह के बिना दवा न लें");
}

if(lang==="gu"){
return text
.replace(/Life-threatening emergency/g,"જીવન માટે ખતરનાક સ્થિતિ")
.replace(/Possible infection or illness/g,"સંક્રમણ અથવા બીમારીની શક્યતા")
.replace(/Minor health issue/g,"નાની આરોગ્ય સમસ્યા")

.replace(/Advice:/g,"સલાહ:")
.replace(/Medicines:/g,"દવાઓ:")
.replace(/Precautions:/g,"સાવચેતીઓ:")

.replace(/Go to hospital immediately/g,"તાત્કાલિક હોસ્પિટલ જાઓ")
.replace(/Take rest and stay hydrated/g,"આરામ કરો અને પાણી પીવો")
.replace(/Rest properly/g,"સારી રીતે આરામ કરો")

.replace(/Paracetamol/g,"પેરાસીટામોલ")
.replace(/ORS/g,"ઓઆરએસ")

.replace(/Monitor symptoms/g,"લક્ષણો પર નજર રાખો")
.replace(/Call ambulance immediately/g,"તાત્કાલિક એમ્બ્યુલન્સ બોલાવો")

.replace(/Do not take any medicine without consulting a doctor/g,"ડોક્ટરની સલાહ વગર દવા ન લો");
}

return text;
}


/* ANALYZE */
async function analyze(){

let s=document.getElementById("symptoms").value;
let lang=document.getElementById("lang").value;

if(!s){
alert("Enter symptoms");
return;
}

let res=await fetch("https://jeevanrakshakai.onrender.com/analyze",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({symptoms:s})
});

let data=await res.json();

let translated=translateFull(data.advice,lang);

document.getElementById("resultBox").innerHTML=
"<b>"+data.level+"</b><br><br>"+translated;
}


/* SPEAK */
function speak(){

let text=document.getElementById("resultBox").innerText;
let lang=document.getElementById("lang").value;

if(!text){
alert("No result");
return;
}

let speech=new SpeechSynthesisUtterance(text);

if(lang==="hi") speech.lang="hi-IN";
else if(lang==="gu") speech.lang="gu-IN";
else speech.lang="en-IN";

window.speechSynthesis.speak(speech);
}


/* MAP */
function map(){
window.open("https://www.google.com/maps/search/hospital+near+me");
}


/* LABEL */
document.getElementById("lang").onchange=function(){
let l=this.value;
let label=document.getElementById("label");

if(l==="hi") label.innerText="अपने लक्षण लिखें:";
else if(l==="gu") label.innerText="તમારા લક્ષણો લખો:";
else label.innerText="Enter your symptoms:";
};

</script>

</body>
</html>
