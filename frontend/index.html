<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeevan Rakshak AI</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background-size:cover;
  transition:1s;
}

.container {
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
  color:white;
  text-align:center;
}

textarea {
  width:100%;
  height:100px;
  border-radius:10px;
  padding:10px;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  color:white;
}

.analyze {background:red;}
.speak {background:green;}
.map {background:blue;}

#resultBox {
  margin-top:15px;
  padding:10px;
  border-radius:10px;
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">
<h2>🚑 Jeevan Rakshak AI</h2>

<select id="lang">
<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="gu">ગુજરાતી</option>
</select>

<p id="label">Enter symptoms:</p>
<textarea id="symptoms"></textarea>

<button class="analyze" onclick="analyze()">Analyze</button>
<button class="speak" onclick="speak()">Speak</button>
<button class="map" onclick="map()">Nearby Hospital</button>

<div id="resultBox"></div>

</div>

<script>

/* BACKGROUND */
let imgs=[
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470"
];
let i=0;
setInterval(()=>{
document.body.style.backgroundImage="url("+imgs[i]+")";
i=(i+1)%imgs.length;
},5000);


/* SIMPLE TRANSLATION (MANUAL) */
function translate(text, lang){

if(lang==="hi"){
return text
.replace("Possible Condition","संभावित स्थिति")
.replace("Advice","सलाह")
.replace("Medicines","दवाएं")
.replace("Precautions","सावधानियां")
.replace("Do not take any medicine without consulting a doctor","डॉक्टर से सलाह के बिना दवा न लें");
}

if(lang==="gu"){
return text
.replace("Possible Condition","સંભવિત સ્થિતિ")
.replace("Advice","સલાહ")
.replace("Medicines","દવાઓ")
.replace("Precautions","સાવચેતીઓ")
.replace("Do not take any medicine without consulting a doctor","ડોક્ટરની સલાહ વગર દવા ન લો");
}

return text;
}


/* ANALYZE */
async function analyze(){

let s=document.getElementById("symptoms").value;
let lang=document.getElementById("lang").value;

let res=await fetch("https://jeevanrakshakai.onrender.com/analyze",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({symptoms:s})
});

let data=await res.json();

let translated=translate(data.advice,lang);

document.getElementById("resultBox").innerHTML=
"<b>"+data.level+"</b><br><br>"+translated;
}


/* SPEAK FIX */
function speak(){

let text=document.getElementById("resultBox").innerText;
let lang=document.getElementById("lang").value;

if(!text){
alert("No result");
return;
}

let speech=new SpeechSynthesisUtterance(text);

if(lang==="hi") speech.lang="hi-IN";
else if(lang==="gu") speech.lang="gu-IN";
else speech.lang="en-IN";

window.speechSynthesis.speak(speech);
}


/* MAP */
function map(){
window.open("https://www.google.com/maps/search/hospital+near+me");
}


/* LABEL CHANGE */
document.getElementById("lang").onchange=function(){
let l=this.value;
let label=document.getElementById("label");

if(l==="hi") label.innerText="अपने लक्षण लिखें:";
else if(l==="gu") label.innerText="તમારા લક્ષણો લખો:";
else label.innerText="Enter symptoms:";
};

</script>

</body>
</html>
