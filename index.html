<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeevan Rakshak AI</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#111;
  color:white;
}

.container {
  width:90%;
  max-width:400px;
  padding:20px;
  background:#222;
  border-radius:15px;
}

textarea {
  width:100%;
  height:100px;
  border-radius:10px;
}

button {
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚑 Jeevan Rakshak AI</h2>

<select id="lang">
<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="gu">ગુજરાતી</option>
</select>

<textarea id="symptoms"></textarea>

<button onclick="analyze()">Analyze</button>
<button onclick="speak()">Speak</button>

<div id="resultBox"></div>

</div>

<script>

async function analyze(){

let s=document.getElementById("symptoms").value;
let lang=document.getElementById("lang").value;

let res=await fetch("https://jeevanrakshakai.onrender.com/analyze",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
symptoms:s,
lang:lang
})
});

let data=await res.json();

document.getElementById("resultBox").innerHTML=
"<b>"+data.level+"</b><br><br>"+data.advice;
}


function speak(){

let text=document.getElementById("resultBox").innerText;
let lang=document.getElementById("lang").value;

let speech=new SpeechSynthesisUtterance(text);

if(lang==="hi") speech.lang="hi-IN";
else if(lang==="gu") speech.lang="gu-IN";
else speech.lang="en-IN";

window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
